name: Send Clan Members TXT to Discord (No GitHub Storage)

on:
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send_members:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (script only)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required secrets are present (no values printed)
        env:
          DISCORD_DEV_WH: ${{ secrets.DISCORD_DEV_WH }}
          WOM_GROUP_ID: ${{ secrets.WOM_GROUP_ID }}
        run: |
          if [ -z "$DISCORD_DEV_WH" ]; then echo "DISCORD_DEV_WH is missing/empty ❌"; exit 1; fi
          if [ -z "$WOM_GROUP_ID" ]; then echo "WOM_GROUP_ID is missing/empty ❌"; exit 1; fi
          echo "Secrets look present ✅"

      - name: Run script (show full traceback on error)
        env:
          DISCORD_DEV_WH: ${{ secrets.DISCORD_DEV_WH }}
          WOM_GROUP_ID: ${{ secrets.WOM_GROUP_ID }}
          WOM_VERIFICATION_CODE: ${{ secrets.WOM_VERIFICATION_CODE }}
        run: |
          python -u scripts/send_clan_members.py
