name: WOM -> Discord Clan Export (TXT)

on:
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send_members:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug secrets (safe check)
        env:
          DISCORD_DEV_WH: ${{ secrets.DISCORD_DEV_WH }}
          WOM_GROUP_ID: ${{ secrets.WOM_GROUP_ID }}
          WOM_VERIFICATION_CODE: ${{ secrets.WOM_VERIFICATION_CODE }}
        run: |
          echo "Webhook length: ${#DISCORD_DEV_WH}"
          echo "WOM_GROUP_ID is set: $([ -n "$WOM_GROUP_ID" ] && echo yes || echo no)"
          if [ -z "$DISCORD_DEV_WH" ]; then echo "DISCORD_DEV_WH is missing/empty ❌"; exit 1; fi
          if [ -z "$WOM_GROUP_ID" ]; then echo "WOM_GROUP_ID is missing/empty ❌"; exit 1; fi
          echo "✅ Secrets appear present."

      - name: Run script
        env:
          DISCORD_DEV_WH: ${{ secrets.DISCORD_DEV_WH }}
          WOM_GROUP_ID: ${{ secrets.WOM_GROUP_ID }}
          WOM_VERIFICATION_CODE: ${{ secrets.WOM_VERIFICATION_CODE }}
        run: |
          python scripts/send_clan_members.py
