name: WOM -> Discord (Secrets + API + Webhook Debug)

on:
  workflow_dispatch: {}

env:
  # Opt into Node 24 now (silences Node 20 deprecation warnings)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send_members:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # SAFE: prints length + group id value only (does not print webhook URL)
      - name: Debug secrets (safe check)
        env:
          DISCORD_DEV_WH: ${{ secrets.DISCORD_DEV_WH }}
          WOM_GROUP_ID: ${{ secrets.WOM_GROUP_ID }}
          WOM_VERIFICATION_CODE: ${{ secrets.WOM_VERIFICATION_CODE }}
        run: |
          echo "Webhook length: ${#DISCORD_DEV_WH}"
          echo "WOM_GROUP_ID: ${WOM_GROUP_ID}"
          if [ -z "$DISCORD_DEV_WH" ]; then echo "DISCORD_DEV_WH is missing/empty ❌"; exit 1; fi
          if [ -z "$WOM_GROUP_ID" ]; then echo "WOM_GROUP_ID is missing/empty ❌"; exit 1; fi
          echo "✅ Secrets appear present."

      - name: Run script (prints status codes)
        env:
          DISCORD_DEV_WH: ${{ secrets.DISCORD_DEV_WH }}
          WOM_GROUP_ID: ${{ secrets.WOM_GROUP_ID }}
          WOM_VERIFICATION_CODE: ${{ secrets.WOM_VERIFICATION_CODE }}
        run: |
